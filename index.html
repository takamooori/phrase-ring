<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrase Ring</title>
<meta name="description" content="シチュエーション別の英語フレーズ集">
<meta name="theme-color" content="#3f5d77" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phrase Ring">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1f2a33;
    --muted: #5b6b78;
    --border: #dde3e8;
    --primary: #3f5d77;
    --primary-text: #ffffff;
    --accent: #b15a4e;
    --mark-bg: rgba(177, 90, 78, 0.10);
    --chip-bg: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c;
      --surface: #1a2128;
      --text: #e3e8ec;
      --muted: #93a3b0;
      --border: #2a333c;
      --primary: #8fb0cc;
      --primary-text: #12171c;
      --accent: #d98a7e;
      --mark-bg: rgba(217, 138, 126, 0.14);
      --chip-bg: #222b33;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.05rem; margin: 0; color: var(--primary); letter-spacing: .02em; }
  .count { font-size: .8rem; color: var(--muted); }
  input[type="search"] {
    width: 100%; margin-top: 8px; padding: 8px 12px;
    font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--primary); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--border); background: var(--chip-bg); color: var(--text);
    border-radius: 999px; padding: 4px 12px; font-size: .85rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .modes { display: flex; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .modes button {
    flex: 1; border: 0; background: var(--surface); color: var(--muted);
    padding: 6px 0; font-size: .85rem; cursor: pointer;
  }
  .modes button + button { border-left: 1px solid var(--border); }
  .modes button[aria-pressed="true"] { background: var(--chip-bg); color: var(--text); font-weight: 600; }
  main { padding: 8px 16px calc(32px + env(safe-area-inset-bottom)); }
  h2 { font-size: .95rem; margin: 20px 0 4px; color: var(--text); }
  h3 { font-size: .8rem; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .card.hidable { cursor: pointer; }
  .en { font-size: 1.02rem; font-weight: 500; }
  .ja { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  mark {
    background: var(--mark-bg); color: inherit;
    border-bottom: 1.5px solid var(--accent); padding: 0 1px; border-radius: 2px;
  }
  .note { font-size: .8rem; color: var(--muted); margin-top: 4px; border-left: 2px solid var(--border); padding-left: 8px; }
  .veil { color: var(--muted); font-size: .85rem; letter-spacing: .05em; opacity: .7; }
  .empty, .error { color: var(--muted); text-align: center; margin-top: 40px; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title-row">
      <h1>Phrase Ring</h1>
      <span class="count" id="count"></span>
    </div>
    <input type="search" id="q" placeholder="検索（英語・日本語）" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="シチュエーション"></div>
    <div class="modes" id="modes" role="group" aria-label="表示モード">
      <button data-mode="both">両方</button>
      <button data-mode="en">英 → 日</button>
      <button data-mode="ja">日 → 英</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="list"></div></main>

<script>
(() => {
  const PREF_KEY = 'phrase-ring:prefs';
  const state = { sit: 'all', mode: 'both', q: '' };
  const revealed = new Set();
  let data = null;

  try {
    const saved = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    if (saved.sit) state.sit = saved.sit;
    if (saved.mode) state.mode = saved.mode;
  } catch (e) {}

  const savePrefs = () => {
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ sit: state.sit, mode: state.mode })); } catch (e) {}
  };

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // key（覚えたい表現）を英文中でハイライト
  const highlight = (text, key) => {
    const frag = document.createDocumentFragment();
    const i = key ? text.toLowerCase().indexOf(key.toLowerCase()) : -1;
    if (i < 0) { frag.append(text); return frag; }
    frag.append(text.slice(0, i));
    frag.append(el('mark', null, text.slice(i, i + key.length)));
    frag.append(text.slice(i + key.length));
    return frag;
  };

  const matches = (p, q) => {
    if (!q) return true;
    const hay = [p.en, p.ja, p.key, p.note].filter(Boolean).join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  };

  const renderChips = () => {
    const box = $('chips');
    box.textContent = '';
    const items = [{ id: 'all', name: 'すべて' }, ...data.situations];
    if (!items.some((s) => s.id === state.sit)) state.sit = 'all';
    for (const s of items) {
      const b = el('button', 'chip', s.name);
      b.setAttribute('aria-pressed', String(s.id === state.sit));
      b.onclick = () => { state.sit = s.id; revealed.clear(); savePrefs(); renderChips(); renderList(); };
      box.append(b);
    }
  };

  const renderModes = () => {
    for (const b of $('modes').querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
    }
  };

  const renderCard = (p, uid) => {
    const card = el('div', 'card');
    const open = state.mode === 'both' || revealed.has(uid);
    const enLine = el('div', 'en');
    const jaLine = el('div', 'ja');

    if (state.mode === 'ja' && !open) enLine.append(el('span', 'veil', 'タップで英語を表示'));
    else enLine.append(highlight(p.en, p.key));

    if (state.mode === 'en' && !open) jaLine.append(el('span', 'veil', 'タップで和訳を表示'));
    else jaLine.textContent = p.ja;

    if (state.mode === 'ja') card.append(jaLine, enLine);
    else card.append(enLine, jaLine);

    if (p.note && open) card.append(el('div', 'note', p.note));

    if (state.mode !== 'both') {
      card.classList.add('hidable');
      card.onclick = () => {
        revealed.has(uid) ? revealed.delete(uid) : revealed.add(uid);
        card.replaceWith(renderCard(p, uid));
      };
    }
    return card;
  };

  const renderList = () => {
    const list = $('list');
    list.textContent = '';
    let n = 0;
    const sits = state.sit === 'all' ? data.situations : data.situations.filter((s) => s.id === state.sit);

    for (const s of sits) {
      const sitBox = document.createDocumentFragment();
      let sitCount = 0;
      if (state.sit === 'all') sitBox.append(el('h2', null, s.name));
      for (const t of s.topics || []) {
        const hits = (t.phrases || []).filter((p) => matches(p, state.q));
        if (!hits.length) continue;
        sitBox.append(el('h3', null, t.name));
        hits.forEach((p, i) => sitBox.append(renderCard(p, `${s.id}/${t.id}/${i}`)));
        sitCount += hits.length;
      }
      if (sitCount) { list.append(sitBox); n += sitCount; }
    }
    $('count').textContent = `${n} phrases`;
    if (!n) list.append(el('p', 'empty', '該当するフレーズがありません'));
  };

  $('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderList(); });
  $('modes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.mode = b.dataset.mode; revealed.clear(); savePrefs(); renderModes(); renderList();
  });

  fetch('phrases.json', { cache: 'no-cache' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((json) => { data = json; renderChips(); renderModes(); renderList(); })
    .catch(() => { $('list').append(el('p', 'error', 'フレーズデータを読み込めませんでした')); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
